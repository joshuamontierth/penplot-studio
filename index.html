<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PenPlot Studio</title>
  <meta name="description" content="Pen plotter G-code generator for the Bambu Lab X1 Carbon: text, drawing, image tracing, patterns and SVG import.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%2310b981'/%3E%3Cpath d='M9 23c3-9 6-12 8-8s4 1 6-6' stroke='%2306281d' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="header"></header>
    <div id="main">
      <nav id="toolstrip" aria-label="Tools"></nav>
      <aside id="left-panel"></aside>
      <section id="canvas-wrap" aria-label="Print bed"></section>
      <aside id="right-panel"></aside>
    </div>
    <footer id="statusbar"></footer>
  </div>

  <noscript>PenPlot Studio needs JavaScript.</noscript>

  <!-- core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/geometry.js"></script>
  <script src="js/core/svg.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/fonts.js"></script>
  <script src="js/core/optimizer.js"></script>
  <script src="js/core/gcode.js"></script>
  <script src="js/core/gcodesim.js"></script>
  <script src="js/core/patterns.js"></script>
  <script src="js/core/imagetrace.js"></script>
  <script src="js/core/stl.js"></script>
  <script src="js/core/penholder.js"></script>
  <!-- app -->
  <script src="js/app/state.js"></script>
  <script src="js/app/objects.js"></script>
  <script src="js/ui/ui-core.js"></script>
  <script src="js/app/canvas.js"></script>
  <script src="js/app/preview.js"></script>
  <script src="js/app/app.js"></script>
  <script src="js/ui/panels-left.js"></script>
  <script src="js/ui/panels-right.js"></script>
  <script src="js/ui/modals.js"></script>
  <script src="js/ui/imagedialog.js"></script>
  <script src="js/ui/penholderdialog.js"></script>
  <script src="js/ui/drives.js"></script>
  <script src="js/ui/handwriting.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      PP.App.init().catch(function (e) {
        console.error(e);
        document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#3b1515;color:#fecaca;padding:10px 16px;border-radius:8px;z-index:999">Startup error: ' + String(e && e.message || e) + '</div>');
      });
    });
  </script>
</body>
</html>
